name: Wake up Streamlit App (Every Morning 07:55 KST)

on:
  schedule:
    # UTC 22:55 = KST 매일 아침 07:55
    - cron: '55 22 * * *'
  workflow_dispatch:

jobs:
  wakeup:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -sL https://lsm230.streamlit.app > /dev/null || true
          echo "Streamlit 앱에 접속하여 깨우기를 완료했습니다."
