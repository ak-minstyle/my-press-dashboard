name: Data Scraper and Telegram Bot

on:
  schedule:
    - cron: '0 * * * *' # 매 정각 1시간마다 실행 (UTC 기준)
  workflow_dispatch: # 수동으로 버튼 눌러서 실행 가능하게 함

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 가져오기
      uses: actions/checkout@v3

    - name: 파이썬 설치
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas streamlit

    - name: 크롤러 실행 (텔레그램 알림 전송)
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
      run: python scraper.py

    - name: data.csv 변경사항 커밋 및 푸시
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data.csv
        # 변경사항이 있을 때만 커밋
        git commit -m "Auto-update data.csv via GitHub Actions" || echo "No changes to commit"
        git push
