name: Data Scraper and Telegram Bot

on:
  schedule:
    - cron: '27,57 * * * *'  # 🔥 여기가 30분마다 실행되도록 바뀐 부분이야
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 가져오기
      uses: actions/checkout@v4

    - name: 파이썬 설치
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas streamlit

    - name: 크롤러 실행 (텔레그램 알림 전송)
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
      run: python scraper.py

    - name: data.csv 변경사항 커밋 및 푸시
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data.csv || true
        git commit -m "Auto-update data.csv via GitHub Actions" || echo "No changes to commit"
        git push || echo "No changes to push"
